name: Quran text audit

on:
  push:
    branches: [main]
    paths:
      - "scripts/audit-quran-text.mjs"
      - "quran-uthmani.txt"
      - ".github/workflows/quran-text-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare-uthmani-text:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check esma.js
          node --check zikirmatik.js
          node --check inspiration.js
          node --check listen.js
          node --check scripts/audit-quran-text.mjs
      - name: Verify bundled Tanzil Uthmani 1.1 text
        run: node scripts/audit-quran-text.mjs
      - name: Upload full comparison report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quran-uthmani-audit-report
          path: quran-audit-report.md
          if-no-files-found: ignore

name: Quran text audit

on:
  push:
    branches: [main]
    paths:
      - "scripts/audit-quran-text.mjs"
      - ".github/workflows/quran-text-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare-uthmani-text:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Compare all 6,236 ayahs against Tanzil Uthmani 1.1
        run: node scripts/audit-quran-text.mjs
      - name: Upload full comparison report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quran-uthmani-audit-report
          path: quran-audit-report.md
          if-no-files-found: ignore

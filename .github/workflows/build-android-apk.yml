name: Build Android APK
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install Capacitor
        run: npm install --no-audit --no-fund
      - name: Build native AdMob bridge
        run: npm run build:ads
      - name: Check JavaScript syntax and app structure
        run: |
          node --check app.js
          node --check ads.js
          node --check esma.js
          node --check zikirmatik.js
          node --check tesbih.js
          node --check inspiration.js
          node scripts/audit-app-structure.mjs
      - name: Build bundled offline Quran and Turkish meal data
        run: node scripts/build-offline-quran-data.mjs
      - name: Prepare app assets
        run: |
          mkdir -p www
          cp index.html app.js esma.js zikirmatik.js inspiration.js tesbih.js styles.css manifest.webmanifest icon-v2.svg quran-uthmani.txt quran-offline-data.json privacy.html SOURCES.md sw.js ads.bundle.js www/
          test -s www/index.html
          test -s www/quran-uthmani.txt
          test -s www/quran-offline-data.json
          test -s www/tesbih.js
          test -s www/ads.bundle.js
          test -s www/sw.js
      - name: Generate Android project
        run: npx cap add android
      - name: Configure Google test AdMob application ID
        run: node scripts/configure-admob-test.mjs
      - name: Set Android package version from package.json
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          version = json.loads(Path("package.json").read_text())["version"]
          parts = version.split(".")
          if len(parts) != 3 or not all(part.isdigit() for part in parts):
              raise SystemExit(f"Invalid package version: {version}")
          major, minor, patch = map(int, parts)
          version_code = major * 10000 + minor * 100 + patch

          gradle_path = Path("android/app/build.gradle")
          if not gradle_path.is_file():
              raise SystemExit("Generated android/app/build.gradle not found")
          lines = gradle_path.read_text().splitlines()
          code_index = next((i for i, line in enumerate(lines) if line.strip().startswith("versionCode ")), None)
          name_index = next((i for i, line in enumerate(lines) if line.strip().startswith("versionName ")), None)
          if code_index is None or name_index is None:
              raise SystemExit("Could not find versionCode/versionName in generated Gradle file")
          lines[code_index] = lines[code_index].split("versionCode")[0] + f"versionCode {version_code}"
          lines[name_index] = lines[name_index].split("versionName")[0] + f'versionName "{version}"'
          gradle_path.write_text("\n".join(lines) + "\n")
          print(f"Android versionName={version}, versionCode={version_code}")
          PY
      - name: Sync Android project
        run: npx cap sync android
      - name: Audit generated Android manifest and SDK dependencies
        run: |
          cd android
          ./gradlew :app:processReleaseMainManifest
          ./gradlew :app:dependencies --configuration releaseRuntimeClasspath > ../android-release-dependencies.txt
          cd ..
          python3 - <<'PY'
          import re
          import xml.etree.ElementTree as ET
          from pathlib import Path

          manifests = [p for p in Path("android/app/build/intermediates").rglob("AndroidManifest.xml")
                       if "merged_manifest" in str(p) and "release" in str(p)]
          if not manifests:
              raise SystemExit("Merged release AndroidManifest.xml was not generated")
          root = ET.parse(manifests[0]).getroot()
          android_ns = "{http://schemas.android.com/apk/res/android}"
          sdk = root.find("uses-sdk")
          if sdk is None or sdk.attrib.get(android_ns + "targetSdkVersion") != "36":
              raise SystemExit("New Google Play app must target Android 16 / API 36")
          permission_tags = ("uses-permission", "uses-permission-sdk-23")
          permissions = sorted({
              node.attrib.get(android_ns + "name", "")
              for tag in permission_tags for node in root.findall(tag)
          } - {""})
          print("Android permissions:", permissions or "none")
          blocked = ("READ_CONTACTS", "WRITE_CONTACTS", "ACCESS_FINE_LOCATION",
                     "ACCESS_COARSE_LOCATION", "READ_SMS", "SEND_SMS",
                     "READ_CALL_LOG", "WRITE_CALL_LOG", "READ_PHONE_STATE",
                     "READ_EXTERNAL_STORAGE", "WRITE_EXTERNAL_STORAGE",
                     "MANAGE_EXTERNAL_STORAGE", "CAMERA", "RECORD_AUDIO")
          unexpected = [p for p in permissions if any(p.endswith(x) for x in blocked)]
          if unexpected:
              raise SystemExit("Unexpected sensitive Android permissions: " + ", ".join(unexpected))

          gradle_path = Path("android/app/build.gradle")
          if not gradle_path.is_file():
              raise SystemExit("Generated app/build.gradle not found")
          gradle = gradle_path.read_text()
          if not re.search(r'applicationId\s*[= ]\s*["\']com\.mehmetsavk\.kuranikerim["\']', gradle):
              raise SystemExit("Android applicationId does not match Capacitor appId")
          if 'versionName "0.94.0"' not in gradle or "versionCode 9400" not in gradle:
              raise SystemExit("Android versionName/versionCode does not match package.json 0.94.0")
          print("Android applicationId and V94 package version verified.")
          PY
          test -s android-release-dependencies.txt
          echo "Merged release manifest audited; release dependency report generated."
      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: kuran-i-kerim-v94-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
